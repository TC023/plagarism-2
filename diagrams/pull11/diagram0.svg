<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1375 596" width="1375" height="596" role="img" aria-label="Architecture" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;Noto Sans&quot;, Helvetica, Arial, sans-serif">
<title>Architecture</title>
<desc>Replaces the behavioral execution subprocess layer with an embeddings-only semantic layer. The new semantic layer delegates to the enhanced `embeddings.py`, which supports both TF-IDF and OpenAI embeddings with a disk cache. The lexical-statistical layer now preserves indentation and reports additional metrics (KL divergence, entropy difference). The change removes approximately 345 lines of behavioral execution code and adds 113 lines of embedding and caching code.</desc>
