<title>Semantic Similarity Flow</title>
<desc>Remove behavioral execution from Layer 3 and replace with pure embeddings analysis using TF-IDF and OpenAI API. Introduce disk caching for OpenAI embeddings, add entropy_difference and KL similarity features to Layer 1, and simplify the semantic layer to a thin wrapper over the embedding engine.</desc>
